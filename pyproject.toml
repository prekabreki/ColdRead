[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldread"
version = "0.1.1"
description = "Cold-read-optimized PDF formatting for voice-over scripts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "prekabreki", email = "prekabreki@users.noreply.github.com" }]
keywords = ["voice-over", "voiceover", "script", "pdf", "cold-read", "reportlab"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "anthropic>=0.40.0,<1",
    "reportlab>=4.0,<6",
    "rich>=13.0,<16",
    "pymupdf>=1.24.0,<2",
    "python-docx>=1.0.0,<2",
    "customtkinter>=5.2.0,<7",
    "tkinterdnd2>=0.3,<1",
    "CTkToolTip>=0.8,<1",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/prekabreki/ColdRead"
Repository = "https://github.com/prekabreki/ColdRead"
Issues = "https://github.com/prekabreki/ColdRead/issues"

[project.scripts]
coldread = "vo_format.cli:main"
coldread-readview = "vo_format.readview.cli:_entry"
coldread-state = "vo_format.readview.state:_entry"
coldread-serve = "vo_format.readview.serve:_entry"

[project.gui-scripts]
coldread-gui = "vo_format.gui_main:gui_main"

[tool.setuptools]
packages = ["vo_format", "vo_format.readview"]

[tool.setuptools.package-data]
vo_format = ["samples/*.md", "readview/*.css", "readview/*.js"]

[tool.ruff]
line-length = 88
target-version = "py310"
lint.select = ["E", "F", "I"]

[tool.pytest.ini_options]
# Pin the rootdir onto sys.path so tests always import THIS checkout's vo_format.
# ColdRead is installed editable, and the editable finder is interpreter-global: it
# names one absolute vo_format path. Without this pin, a parallel git worktree
# (foreman executors, .claude/worktrees subagents) can run the bare `pytest` console
# script and silently import the MAIN clone's vo_format instead of its own — and the
# tests still pass, so nothing surfaces it. Verified 2026-08-02 by reproducing the leak.
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
